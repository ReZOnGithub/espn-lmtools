<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>League Desk</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%230b0f16'/%3E%3Cpath d='M17 22h30M17 32h20M17 42h26' stroke='url(%23g)' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 6.3"/><path d="M20 4v7h-7"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.4 1Z"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.5 12.5 5 5 10-11"/></symbol>
      <symbol id="i-trade" viewBox="0 0 24 24"><path d="M4 8h13"/><path d="m14 4 4 4-4 4"/><path d="M20 16H7"/><path d="m10 20-4-4 4-4"/></symbol>
      <symbol id="i-drop" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V5h6v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></symbol>
      <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.6 2.7 8 7 10 4.3-2 7-5.4 7-10V6l-7-3Z"/><path d="m9.5 12 1.8 1.8 3.4-3.6"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2 6 6 2-6 2-2 6-2-6-6-2 6-2 2-6Z"/></symbol>
      <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 20c0-3.2 2.4-5.5 5.5-5.5s5.5 2.3 5.5 5.5"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.6M17.5 14.8c1.8.6 3 2.3 3 4.5"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4Z"/><path d="M8 5H4v2a4 4 0 0 0 4 4M16 5h4v2a4 4 0 0 1-4 4"/><path d="M12 13v4M8.5 21h7M10 17h4l1 4H9l1-4Z"/></symbol>
      <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 13 2.5-7h5"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4 8.5 8.5 0 1 0 20 14.5Z"/></symbol>
      <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h13M13 7l5 5-5 5"/></symbol>
      <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 3 20h18L12 4Z"/><path d="M12 10v4M12 17.2v.1"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8.5 10V7a3.5 3.5 0 0 1 7 0v3"/></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark"><span></span><span></span><span></span></div>
        <div>
          <div class="brand-name">League Desk</div>
          <div class="brand-sub">Fantasy command center</div>
        </div>
      </div>

      <div class="side-league" id="sideLeague">
        <span class="skeleton skeleton-line" style="width:70%"></span>
      </div>

      <div class="side-scroll">
        <div class="side-label">
          <span>Teams</span>
          <span id="teamCount" class="side-count">—</span>
        </div>
        <nav class="team-list" id="teamList" aria-label="Teams"></nav>
      </div>

      <div class="side-footer">
        <label class="account-picker">
          <span class="account-avatar" id="accountAvatar">–</span>
          <span class="account-meta">
            <span class="account-eyebrow">Signed in as</span>
            <select id="accountSelect" aria-label="Account"></select>
          </span>
          <svg class="icon"><use href="#i-chevron"/></svg>
        </label>

        <div class="lm-row">
          <span class="lm-copy">
            <svg class="icon"><use href="#i-shield"/></svg>
            <span><strong>LM mode</strong><small>Escalate &amp; restore</small></span>
          </span>
          <button class="switch" id="lmSwitch" role="switch" aria-checked="false" aria-label="Toggle League Manager mode"><span></span></button>
        </div>

        <div class="footer-actions">
          <button class="ghost-btn" data-action="toggle-theme">
            <svg class="icon" id="themeIcon"><use href="#i-sun"/></svg>
            <span id="themeLabel">Light</span>
          </button>
          <button class="ghost-btn" data-action="settings">
            <svg class="icon"><use href="#i-settings"/></svg>
            <span>Settings</span>
          </button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <div class="eyebrow" id="topEyebrow">League</div>
          <div class="title-row">
            <h1 id="leagueName">Loading…</h1>
            <span class="chip" id="leagueSeason"></span>
            <span class="chip chip-week" id="leagueWeek"></span>
          </div>
        </div>

        <nav class="tabs" id="tabs" aria-label="Views">
          <button class="tab is-active" data-tab="rosters">Rosters</button>
          <button class="tab" data-tab="trades">Trades <span class="tab-badge" id="tradeBadge" hidden>0</span></button>
          <button class="tab" data-tab="activity">Activity</button>
        </nav>

        <div class="topbar-actions">
          <label class="search">
            <svg class="icon"><use href="#i-search"/></svg>
            <input id="searchInput" type="search" placeholder="Search all players…" autocomplete="off" spellcheck="false">
            <kbd>/</kbd>
          </label>
          <button class="icon-btn" data-action="refresh" title="Refresh league" aria-label="Refresh league">
            <svg class="icon"><use href="#i-refresh"/></svg>
          </button>
          <button class="icon-btn" data-action="settings" title="Settings" aria-label="Settings">
            <svg class="icon"><use href="#i-settings"/></svg>
          </button>
        </div>
      </header>

      <div class="lm-banner" id="lmBanner" hidden>
        <svg class="icon"><use href="#i-shield"/></svg>
        <span><strong>LM mode is armed.</strong> Write actions may briefly promote this account to League Manager, then restore the original flag.</span>
        <button class="banner-close" data-action="toggle-lm" aria-label="Turn off LM mode"><svg class="icon"><use href="#i-close"/></svg></button>
      </div>

      <section class="content" id="content">
        <div class="loading-grid">
          <div class="skeleton skeleton-hero"></div>
          <div class="skeleton-grid">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
        </div>
      </section>
    </main>

    <aside class="trade-panel" id="tradePanel" aria-label="Trade builder">
      <div id="tradeBody"></div>
    </aside>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
</body>
</html>
